# This configuration file contains all config parameters used by Obliqua.
# The variables are explained below. If you want to model your own conditions,
# try making a copy of this file and then modifying it.

# The general structure is:
#   [params]        parameters for code execution, output files, time-stepping, convergence
#   [star]          stellar parameters, model selection
#   [orbit]         planetary orbital parameters
#   [struct]        planetary structure (mass, radius)

# ----------------------------------------------------

title = "All_options"               # Name for this configuration file
version = "1.0"                 # Version of this configuration file

# Parameters
[params]
    # output files
    [params.out]
        path        = "out"     # Output directory for results, "out" will store to the default OUT_DIR
        time        = 0.0       # Time of simulation [yr]
        logging     = "INFO"
        plot_fmt    = "png"     # Plotting image file format, "png" or "pdf" recommended

# ----------------------------------------------------
# Star
[star]
    # Physical parameters
    mass            = 1.0       # stellar mass [M_sun]

[planet]
    mass_tot        = 1.0       # total initial planet mass [M_earth]

# Orbital system
[orbit]
    semimajoraxis   = 1.0       # initial semi-major axis of planet's orbit [AU]
    eccentricity    = 0.0       # initial eccentricity of planet's orbit [dimensionless]

    [orbit.obliqua]
        store_3D    = false     # Store 3D tidal response (displacement, stress, strain) for each layer. Note: this will generate large output files. If false, radial profiles of tidal responses will be stored instead.
        enforce_ec  = true      # Enforce energy conservation in tidal response calculations, improves stability in fluid-mush cases at low forcing frequencies (< 1e-7 Hz). This does not affect the Lovenumbers.
        optimize_scales = false # Optimize non-dimensionalization scales for the relaxation method. This can improve convergence and stability, especially for low forcing frequencies (< 1e-7 Hz). However, do not use with Bigfloat precision.
        solid_shell = true      # Insert an infinitesimal solid shell around the core. This patches an issue where y2 and y4 become decoupled and cause the solution to diverge in fluid layers. Only use with solid1d_relax or solid1d_mush_relax.

        min_frac    = 0.02      # Minimal segment radius fraction before smoothing [dimensionless]
        visc_l      = 1e2       # Pure liquid viscosity [Pa s]
        visc_lus    = 5e3       # Liquidus viscosity to use [Pa s]
        visc_s      = 1e22      # Pure solid visosity [Pa s]
        visc_sus    = 5e4       # Solidus viscosity to use [Pa s]
        n           = [2]       # Power of the radial factor (goes with (r/a)^{n}, since r<<a only n=2 contributes significantly)
        m           = [0, 2]    # Harmonic of the true anomaly. m=2 corresponds to the semidiurnal tide, m=1 diurnal tide
        spectrum    = "adaptive"# Obtain k2 spectrum for whole spectrum (<"full">) or region of interest (<"adaptive">)
        N_sigma     = 20        # Number probe frequencies to evaluate k2 at
        p_min       = -10       # Minimum period for orbital and axial frequencies [log(kyr)] i.e. forcing occurion over minimal 1e-17 yr interval
        p_max       = 8         # Maximum period for orbital and axial frequencies [log(kyr)] i.e. forcing occurion over maximal 1e9   yr interval
        s_min       = "none"    # Minimum tidal mode range (k is the Fourier index in mean anomaly), set <nothing> to obtain tidal mode range from eccentricity relation
        s_max       = "none"    # Maximum tidal mode range (k is the Fourier index in mean anomaly), set <nothing> to obtain tidal mode range from eccentricity relation
        
        material_mu = "andrade" # Material type for complex shear modulus ("andrade", "maxwell", "elastic")
        material_k  = "andrade" # Material type for complex bulk modulus ("andrade", "maxwell", "elastic")
        alpha       = 0.3       # Power-law exponent, only for Andrade rheology (free parameter)

        # Solid interior model
        # Controls how the solid portion of the interior responds to tidal forcing.
        # - "none"                : No solid interior model.
        # - "solid0d"             : Zero-dimensional solid model. The solid region is treated as a single
        #                           effective layer with averaged mechanical properties. Fast but cannot
        #                           resolve radial structure in deformation or dissipation.
        # - "solid1d"             : Radially resolved solid model. Solves the tidal response through a
        #                           layered solid interior. Allows realistic rigidity, density, and
        #                           rheology profiles.
        # - "solid1d-relax"       : Same as solid1d, but uses the relaxation method to obtain a solution 
        #                           (instead of the shooting method) which is generally more stable. 
        #                           However, this method is generally slower.
        # - "solid1d-mush"        : Same as solid1d but includes a partially molten/porous ("mushy") region
        #                           with evolving rheology between solid and liquid behavior.
        # - "solid1d-mush-relax"  : Same as solid1d_relax but includes a partially molten/porous ("mushy") region
        #                           with evolving rheology between solid and liquid behavior.
        module_solid = "solid1d-relax"

        # Mushy layer model
        # Controls how partially molten regions are treated.
        # - "none"          : No explicit mush layer treatment.
        # - "interp"        : Rheological properties transition smoothly between solid and fluid
        #                     regimes using interpolation across the melt fraction range.
        module_mushy = "interp"

        # Fluid layer model
        # Controls how the fluid (e.g., magma ocean or atmosphere) responds to tidal forcing.
        # - "none"          : No fluid layer.
        # - "fluid0d"       : Zero-dimensional fluid model. The fluid region is treated as a single
        #                     effective layer with averaged mechanical properties. Fast but cannot
        #                     resolve radial structure in deformation or dissipation.
        # - "fluid1d"       : Same as fluid0d but allows for user specified heating distribution.
        module_fluid = "fluid1d"

        [orbit.obliqua.solid]
            ncalc       = 100       # Number of sublayers to use for dim=1 solid tides (for shooting method)
            dr_min      = 10        # Minimum spacing between grid points (for relaxation method) [m]
            dr_max      = 300       # Maximum spacing between grid points (for relaxation method) [m]
            core        = "liquid"  # Core solution to use as CMB boundary condition, options: "liquid", "solid", "inertial"
            core_props  = "core"    # Core properties to use for CMB boundary condition, options: "core", "mantle"
            bulk_l      = 1e9       # Liquid bulk modulus [Pa]
            dbulk_power = 0.5       # Drained bulk modulus powerlaw scaling exponent
            porosity_thresh = 3e-2  # Percolation threshold, at which there is a first‐order transition from fully connected to fully isolated pore space [dimensionless]

        [orbit.obliqua.fluid]
            sigma_R     = 2e-4     # Rayleigh drag coefficient at interface [dimensionless]
            sigma_R_inf = 1e-4     # Rayleigh drag coefficient in pure fluid [dimensionless]
            sigma_R_prf = "dynamic_interp" # Rayleigh drag profile ("uniform", "exp", "linear", "quadratic", "dynamic")
            H_R         = 1e5       # Rayleigh drag scale height [m]
            efficiency  = 1e-2      # Rayleigh drag efficiency at core interface [dimensionless]

        [orbit.obliqua.mushy]
            b_width     = 1.5e-1    # Fraction of segment height as standard deviation for lower dissipation peak
            t_width     = 1e-1      # Fraction of segment height as standard deviation for upper dissipation peak

# Planetary structure - physics table
[struct]
    core_density = 10738.33     # Core density [kg m-3]
    core_shear   = 0.0          # Core shear modulus [Pa]
    core_bulk    = 5e11         # Core bulk modulus [Pa]

# Interior energy transport (mantle & core thermal evolution)
[interior_energetics]

    # Rheology and convection
    grain_size                = 0.1          # crystal grain size [m]