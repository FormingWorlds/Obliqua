# This job installs Love.jl and Fluid.jl, and runs tests 
# This occurs when a PR to main is created

name: Tests

permissions:
  actions: write
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
        - master 
        - main
  push:
      branches:
        - master 
        - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Setup Julia
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      # Run tests
      - name: Run test suite
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'

      # Run coverage
      - name: Get coverage
        run: |
          export CODECOV_TOKEN="${{ secrets.CODECOV_TOKEN }}"
          julia --project test/runcoverage.jl
          export total=$(cat coverage.total)
          echo "total=$total" >> $GITHUB_ENV
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Obliqua
        
      - name: Publish test badges to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          gist_id = "ebf04f7a12a5b14edb8198927121d149"
          token = os.environ.get("GIST_TOKEN", "").strip()
          if not token:
              raise RuntimeError("GIST_TOKEN is not set")

          badge_files = ["tests-unit.json", "tests-integration.json", "tests-total.json"]
          files = {}
          for name in badge_files:
              p = Path(".github/badges") / name
              files[name] = {"content": p.read_text(encoding="utf-8")}

          payload = json.dumps({"files": files}).encode("utf-8")
          req = Request(
              url=f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urlopen(req) as resp:
              if resp.status != 200:
                  raise RuntimeError(f"Failed to update gist, status={resp.status}")
          PY